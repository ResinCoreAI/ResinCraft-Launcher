<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Resin Credit wallet: Maid Sack (A + B) with the ResinCraft logo, cel-shaded: her cloth sack tied with her band, ruffle and bow</title>
  <defs>
    <linearGradient id="cloth" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F1EDE6"/>
      <stop offset="1" stop-color="#D9D1C4"/>
    </linearGradient>
    <linearGradient id="clothTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2DBD0"/>
    </linearGradient>
    <radialGradient id="resin" cx="0.38" cy="0.62" r="0.75">
      <stop offset="0" stop-color="#B6FF8F"/>
      <stop offset="0.45" stop-color="#4CD94A"/>
      <stop offset="1" stop-color="#1C8F2E"/>
    </radialGradient>
    <radialGradient id="gem" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#D3B3FF"/>
      <stop offset="0.5" stop-color="#8B46FF"/>
      <stop offset="1" stop-color="#4B1FA8"/>
    </radialGradient>
    <linearGradient id="satin" x1="0" y1="0" x2="0" y2="1">
