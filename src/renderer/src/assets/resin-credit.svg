      <stop offset="1" stop-color="#CFCFD6"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55555E"/>
      <stop offset="0.45" stop-color="#26262B"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <radialGradient id="logoDrop" cx="0.4" cy="0.6" r="0.75">
      <stop offset="0" stop-color="#A874FF"/>
      <stop offset="0.6" stop-color="#8B46FF"/>
      <stop offset="1" stop-color="#6A2FE0"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="236" rx="86" ry="9" fill="#1E1E1E" opacity="0.18"/>
