  <path fill="#CFC5B6" opacity="0.75" d="M176 108 C202 130 220 160 212 194 C206 214 168 224 128 225 C170 214 196 194 198 166 C200 142 190 122 176 108 Z"/>
  <path fill="none" stroke="#B8AD9C" stroke-width="5" stroke-linecap="round" d="M62 192 Q80 210 104 213"/>
  <path fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.9" d="M66 142 Q60 160 62 176"/>
