[package]
name = "resincraft"
version = "1.4.1"
description = "ResinCraft Launcher: a modern Minecraft: Java Edition launcher by Puirkle"
authors = ["Puirkle"]
license = "AGPL-3.0-only"
repository = "https://github.com/ResinCoreAI/ResinCraft-Launcher"
edition = "2021"
rust-version = "1.85"

[lib]
name = "resincraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "resincraft"
path = "src/main.rs"
required-features = ["desktop"]

# The Linux panel: the same engine with no window (cargo build --release --no-default-features --features panel --bin resincraft-panel).
[[bin]]
name = "resincraft-panel"
path = "src/bin/panel.rs"
required-features = ["panel"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-updater", "dep:tauri-plugin-single-instance"]
# The panel's own website (panelweb.rs): HTTPS on the host's domain.
panel = ["dep:axum", "dep:axum-server", "dep:rustls-acme", "dep:argon2", "dep:rustls-pemfile"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
futures = "0.3"
anyhow = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
# QR codes for 2FA setup (SVG only, no image libraries).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
urlencoding = "2"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
quick-xml = "0.37"
# Reads the Modrinth App's profile database (app.db) for "Move from another launcher".
rusqlite = { version = "0.32", features = ["bundled"] }
# UPnP port mapping so friends can join a hosted server without manual port forwarding.
igd-next = "0.17"
# Stable public addresses for hosted servers through playit.gg (BSD-2-Clause agent), and bore relay auth.
playit-agent-core = { git = "https://github.com/playit-cloud/playit-agent", rev = "633d650869a9cdb2c906efa9effc58aa8b7725a3" }
playit-api-client = { git = "https://github.com/playit-cloud/playit-agent", rev = "633d650869a9cdb2c906efa9effc58aa8b7725a3" }
hmac = "0.12"
tokio-util = "0.7"
# Internationalised domain names (to punycode) for a hosted server's own domain.
idna = "1"
# In-app updates: the signed NSIS installer from each release, installed in place (see src/updater.rs).
tauri-plugin-updater = { version = "2", optional = true }
# ResinCraft Relay (../relay): the launcher's side of <name>.rscraft.resincore.tech tunnels.
resincraft-relay = { path = "../relay", default-features = false, features = ["agent"] }
# Mod and modpack descriptions and changelogs (Markdown) for Discover's details page; the UI sanitizes the HTML.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The host's own Discord bot for whitelist requests (server/discordbot.rs): Discord's gateway is a websocket.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# A second start (e.g. while hidden in the tray) brings the running ResinCraft back instead of opening another.
tauri-plugin-single-instance = { version = "2", optional = true }
# The panel's website: Let's Encrypt certificates, passwords hashed with Argon2.
axum = { version = "0.8", optional = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum"], optional = true }
argon2 = { version = "0.5", features = ["std"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# proc_pid_rusage for the RAM display (core/memory.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_NetworkManagement_Dns", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Storage_Packaging_Appx"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
