[package]
name = "resincraft"
version = "1.2.1"
description = "ResinCraft Launcher: a modern Minecraft: Java Edition launcher by Puirkle"
authors = ["Puirkle"]
license = "MIT"
repository = "https://github.com/ResinCoreAI/ResinCraft-Launcher"
edition = "2021"
rust-version = "1.85"

[lib]
name = "resincraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
futures = "0.3"
anyhow = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
urlencoding = "2"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
quick-xml = "0.37"
# Reads the Modrinth App's profile database (app.db) for "Move from another launcher".
rusqlite = { version = "0.32", features = ["bundled"] }
# UPnP port mapping so friends can join a hosted server without manual port forwarding.
igd-next = "0.17"
# Stable public addresses for hosted servers through playit.gg (BSD-2-Clause agent), and bore relay auth.
playit-agent-core = { git = "https://github.com/playit-cloud/playit-agent", rev = "633d650869a9cdb2c906efa9effc58aa8b7725a3" }
playit-api-client = { git = "https://github.com/playit-cloud/playit-agent", rev = "633d650869a9cdb2c906efa9effc58aa8b7725a3" }
hmac = "0.12"
tokio-util = "0.7"
# Internationalised domain names (to punycode) for a hosted server's own domain.
idna = "1"
# In-app updates: the signed NSIS installer from each release, installed in place (see src/updater.rs).
tauri-plugin-updater = "2"
# ResinCraft Relay (../relay): the launcher's side of <name>.rscraft.resincore.tech tunnels.
resincraft-relay = { path = "../relay", default-features = false, features = ["agent"] }
# Mod and modpack descriptions and changelogs (Markdown) for Discover's details page; the UI sanitizes the HTML.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
# The relay server itself, for examples/check_relay.rs.
resincraft-relay = { path = "../relay" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_NetworkManagement_Dns", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
