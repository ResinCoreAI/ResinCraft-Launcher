[package]
name = "resincraft-setup"
version = "1.0.0"
description = "ResinCraft Setup: installs the newest ResinCraft Launcher"
authors = ["Puirkle"]
license = "AGPL-3.0-only"
repository = "https://github.com/ResinCoreAI/ResinCraft-Launcher"
edition = "2021"
build = "build.rs"

[[bin]]
name = "ResinCraft-Setup"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.3"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
