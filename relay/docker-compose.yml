# ResinCraft Relay with Docker Compose. In this folder on the server:
#   mkdir -p config/tls data && cp relay.example.toml config/relay.toml   (then edit: see the README, "Docker")
#   sudo chown -R 65532:65532 config data
#   docker compose run --rm relay set-admin-password
#   docker compose up -d --build
services:
  relay:
    build: .
    image: resincraft-relay:latest
    restart: unless-stopped
    ports:
      - "25565:25565"          # players (Minecraft)
      - "7000:7000"            # launchers (TLS)
      - "7443:7443"            # admin dashboard (HTTPS); drop this line to keep it unreachable from outside
      - "127.0.0.1:7001:7001"  # /healthz, /metrics (this machine only)
    volumes:
      - ./config:/etc/resincraft-relay   # relay.toml (set-admin-password writes into it) and tls/
      - ./data:/var/lib/resincraft-relay
    environment:
      RUST_LOG: info
    # SIGTERM first: launchers are told to reconnect and players get drain_secs to finish.
    stop_grace_period: 20s
    ulimits:
      nofile: 65536
