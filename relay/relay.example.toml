# ResinCraft Relay configuration. Copy to relay.toml and adjust.
# Players join <name>.<base_domain>; launchers connect to the agent port.

base_domain = "rscraft.resincore.tech"

# The Minecraft port players connect to. Add "[::]:25565" for IPv6 (both can be listed).
public_listen = ["0.0.0.0:25565"]
# Where ResinCraft Launcher connects (TLS when [tls] is set).
agent_listen = ["0.0.0.0:7000"]
# /healthz, /metrics and the admin API. Keep it on localhost (or a private network).
admin_listen = "127.0.0.1:7001"

# Name reservations, sessions, bans and traffic counters. Relative paths are next to this file.
data_file = "data/relay.json"

# "text" for people, "json" for log collectors. Player IP addresses are only logged at debug level
# (RUST_LOG=debug), never at the default info level.
log_format = "text"
# Also write the log to daily files next to this config (logs/relay.2026-10-18.log …), keeping log_keep_days.
# log_file = "logs/relay.log"
# log_keep_days = 14

# How long players already connected may keep playing after a shutdown signal.
drain_secs = 10

# TLS for the agent port, e.g. from Let's Encrypt (certbot). The files are re-read when they change.
# Leave this section out to run plain TCP behind a TLS terminator, or for local tests.
[tls]
cert = "/etc/letsencrypt/live/rscraft.resincore.tech/fullchain.pem"
key = "/etc/letsencrypt/live/rscraft.resincore.tech/privkey.pem"

# The admin dashboard: live tunnels, names, bans, usage, limits and events, on its own HTTPS port with the
# [tls] certificate. Set the password with `resincraft-relay --config relay.toml set-admin-password`.
[dashboard]
listen = "0.0.0.0:7443"         # "127.0.0.1:7443" to reach it only through an SSH tunnel
password_hash = ""              # written by set-admin-password
allow_ips = []                  # optional: only these IPs / CIDR ranges may open it
session_hours = 12

[limits]
tunnels_per_account = 3        # names online at once
names_per_account = 5          # names reserved
connections_per_tunnel = 64    # players on one name at once
connections_per_ip = 16        # players from one IP at once, all names together
agents_per_ip = 16             # launchers from one IP at once
monthly_gb_per_account = 100   # traffic both ways per calendar month (UTC); 0 = unlimited
session_minutes = 120          # a relay session lasts this long; the host presses Continue for another. 0 = no limit
session_warn_minutes = [10, 1] # when the host's launcher warns (Console banner, toast, in-game chat)
handshake_timeout_secs = 5
idle_timeout_secs = 300
logins_per_ip_per_hour = 20    # sign-ins with a Minecraft token (each asks Mojang)
name_expiry_days = 180         # names nobody brought online for this long are freed
session_days = 30              # launcher sessions expire after this long unused
max_pending_handshakes = 2048

[auth]
profile_url = "https://api.minecraftservices.com/minecraft/profile"
# Extra names nobody may take (a built-in list already covers www, admin, relay, resincraft, …).
reserved_names = []

[bans]
# Minecraft UUIDs and IP addresses / CIDR ranges banned in the config. Bans added through the admin API
# are kept in the data file instead.
uuids = []
ips = []

[admin]
# Bearer tokens for /admin/* (generate with: openssl rand -hex 32). Empty: the admin API is off.
tokens = []

[custom_domains]
# Players' own domains: play.example.com CNAME <name>.<base_domain> (DNS only, not proxied). SRV records
# work without this.
enabled = true
resolvers = ["1.1.1.1:53", "8.8.8.8:53"]
