[package]
name = "resincraft-relay"
version = "0.1.0"
description = "ResinCraft Relay: name-based Minecraft tunnels for servers hosted in ResinCraft Launcher"
authors = ["Puirkle"]
license = "MIT"
repository = "https://github.com/ResinCoreAI/ResinCraft-Launcher"
edition = "2021"
rust-version = "1.85"

[lib]
name = "resincraft_relay"
path = "src/lib.rs"

[[bin]]
name = "resincraft-relay"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# The launcher side: connect to a relay, sign in, claim a name and serve players (src-tauri uses only this).
agent = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
# The relay itself (the resincraft-relay binary).
server = [
    "agent", "dep:reqwest", "dep:toml", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender", "dep:sha2",
    "dep:hex", "dep:base64", "dep:getrandom", "dep:socket2", "dep:argon2", "dep:rpassword", "dep:windows-service",
]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-yamux = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# ring only (no aws-lc), so the relay builds as one static musl binary without a C toolchain beyond cc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
webpki-roots = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
toml = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }
socket2 = { version = "0.5", optional = true }
# The admin dashboard's password hash, and `set-admin-password` (writes it into relay.toml).
argon2 = { version = "0.5", optional = true }
rpassword = { version = "7", optional = true }
# log_file: daily log files (a Windows service has no console).
tracing-appender = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
# `resincraft-relay service`: runs as a Windows service (graceful stop, restart on failure).
windows-service = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rcgen = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
