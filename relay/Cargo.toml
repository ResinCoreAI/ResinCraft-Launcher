[package]
name = "resincraft-relay"
version = "0.1.0"
description = "The launcher side of ResinCraft Relay tunnels (the relay server is kept elsewhere)"
authors = ["Puirkle"]
license = "AGPL-3.0-only"
repository = "https://github.com/ResinCoreAI/ResinCraft-Launcher"
edition = "2021"
rust-version = "1.85"

[lib]
name = "resincraft_relay"
path = "src/lib.rs"

[features]
# Kept so src-tauri's `features = ["agent"]` still resolves; the agent is always built.
default = []
agent = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-yamux = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# ring only (no aws-lc).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
