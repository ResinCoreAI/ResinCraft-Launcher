# Builds the Windows installer and attaches it to a draft GitHub Release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Repository secrets RESINCRAFT_MS_CLIENT_ID and RESINCRAFT_CURSEFORGE_KEY are compiled into the app
# (see src-tauri/build.rs); they are never stored in the code.
#
# Updates: TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD sign the installer, which is also the
# update file (setup.exe + setup.exe.sig), and latest.json is attached for the in-app updater. The release stays a
# draft until it is published by hand; the updater reads /releases/latest/download/latest.json, which skips drafts,
# so publishing the draft is what offers the update to players (README, "Updates").
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      # v0.2.0 shipped with a mangled key (a dotenv parser expanded its `$` parts); never build with a key that fails.
      - name: Check the CurseForge key
        shell: bash
        env:
          KEY: ${{ secrets.RESINCRAFT_CURSEFORGE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: $KEY" https://api.curseforge.com/v1/games/432)
          if [ "$code" != "200" ]; then echo "::error::CurseForge rejected RESINCRAFT_CURSEFORGE_KEY (HTTP $code). Re-set it with: printf '%s' \"<key>\" | gh secret set RESINCRAFT_CURSEFORGE_KEY"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESINCRAFT_MS_CLIENT_ID: ${{ secrets.RESINCRAFT_MS_CLIENT_ID }}
          RESINCRAFT_CURSEFORGE_KEY: ${{ secrets.RESINCRAFT_CURSEFORGE_KEY }}
          # Optional: without them the build still works, the relay route just isn't offered.
          RESINCRAFT_RELAY_URL: ${{ secrets.RESINCRAFT_RELAY_URL }}
          RESINCRAFT_RELAY_DOMAIN: ${{ secrets.RESINCRAFT_RELAY_DOMAIN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ResinCraft Launcher ${{ github.ref_name }}
          releaseBody: Download the installer below. Windows may warn that the publisher is unverified until releases are code-signed. Already have ResinCraft? It offers this update by itself and installs it in place; your instances and accounts stay.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
