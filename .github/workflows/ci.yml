# Typechecks, builds and tests on Windows, Linux (x64 and ARM) and macOS on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            relay -> target
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - run: cargo check --all-targets --locked
        working-directory: src-tauri
      - run: cargo test --lib --locked
        working-directory: src-tauri
      # The launcher's side of ResinCraft Relay (protocol and agent).
      - run: cargo test --locked
        working-directory: relay
